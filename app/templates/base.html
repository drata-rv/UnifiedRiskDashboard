<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FirstService Risk Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand-mark">
        <svg data-testid="AppLogo" data-id="AppLogo" fill="none" height="20" viewBox="0 0 27 20" width="27" xmlns="http://www.w3.org/2000/svg"><g fill="var(--icon-neutral-initial)"><path d="m6.8554 19.9979h8.0966c6.6279 0 11.4116-3.9251 11.4116-9.9969 0-6.07173-4.7847-10.001-11.4116-10.001h-8.0966v.04408c.04329-.04408 5.1592 4.80882 5.1592 4.80882h2.7079c3.6915 0 6.5776 1.48436 6.5776 5.1492 0 3.6647-2.8861 5.1491-6.5776 5.1491h-2.7109l-5.15721 4.8488z"></path><path d="m6.84535 5.30841c1.26297 2.08503 3.21255 3.63809 5.49565 4.38013l1.3497.43796-1.3497.4379c-2.2831.741-4.23268 2.2951-5.49565 4.3801-1.26297-2.085-3.21252-3.6381-5.49566-4.3801l-1.34969-.4379 1.34969-.43796c2.28314-.74099 4.23269-2.2951 5.49566-4.38013z"></path></g></svg>
      </span>
      <span class="brand-title">FirstService &middot; Enterprise Risk Management</span>
    </div>
    <div class="topbar-right">
      <a class="topbar-link" href="/">Dashboard</a>
      <a class="topbar-link" href="/history">History</a>
      <span class="avatar" title="{{ user if user is defined else '' }}">{{ (user if user is defined else '?')[:1] | upper }}</span>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar">
      <a class="sidebar-icon" href="/" title="Dashboard">&#9632;</a>
      <a class="sidebar-icon" href="/history" title="History">&#8635;</a>
    </nav>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
